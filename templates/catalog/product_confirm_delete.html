{% extends "base.html" %}

{% block title %}Delete Product | MarketFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h2 class="mb-3">Delete product</h2>
    <p>Are you sure you want to delete <strong>{{ product.name }}</strong>? This cannot be undone.</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, delete</button>
      <a href="{% url 'catalog:product_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
