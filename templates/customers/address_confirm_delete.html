{% extends "base.html" %}

{% block title %}Delete Address | MarketFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h2 class="mb-3">Delete address</h2>
    <p>Are you sure you want to delete the address for <strong>{{ address.full_name }}</strong> ({{ address.city }})?</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, delete</button>
      <a href="{% url 'customers:address_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
